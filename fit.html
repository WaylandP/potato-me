<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>potato-me · part fitting</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css">
  <style>
    .fit { max-width: 1180px; margin: 0 auto; padding: 16px 24px 48px; display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 24px; align-items: start; }
    .fit-stage { position: sticky; top: 16px; }
    .fit-stage canvas { display: block; width: 100%; height: auto; border-radius: 16px; background: #ccc; }
    .fit-panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 22px; display: grid; gap: 14px; }
    .fit-panel label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
    .fit-panel select, .fit-panel input[type=number], .fit-panel textarea { font: 15px/1.3 var(--body); padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink); }
    .fit-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .fit-panel textarea { min-height: 220px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .fit-keys { font-size: 14px; color: var(--muted); }
    kbd { font: 600 12px/1 ui-monospace, Menlo, monospace; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
    @media (max-width: 820px) { .fit { grid-template-columns: 1fr; } .fit-stage { position: static; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand"><img src="favicon.svg" alt="" width="40" height="40"><span class="wordmark">potato-me</span></div>
    <p class="tagline">Part fitting. Nudge a layer, then paste the result into <code>src/fit-data.js</code>.</p>
    <a class="gh-link" href="./">Back to the editor</a>
  </header>
  <main class="fit">
    <section class="fit-stage" aria-label="Preview"><canvas id="stage" width="1024" height="1024"></canvas></section>
    <section class="fit-panel" aria-label="Controls">
      <div class="fit-row">
        <label>Body shape <select id="shape"></select></label>
        <label>Skin <select id="skin"></select></label>
        <label>Layer group <select id="group"></select></label>
        <label>Part <select id="part"></select></label>
      </div>
      <div class="fit-row">
        <label>Scope <select id="scope"><option value="shape">this shape, whole group</option><option value="part">this part, every shape</option><option value="part-shape">this part on this shape</option></select></label>
        <label>dx <input id="dx" type="number" step="1" value="0"></label>
        <label>dy <input id="dy" type="number" step="1" value="0"></label>
        <label>scale <input id="scale" type="number" step="0.01" value="1"></label>
        <label>rotate ° <input id="rot" type="number" step="0.5" value="0"></label>
        <label><input id="flip" type="checkbox"> flip</label>
      </div>
      <p class="fit-keys">With the preview focused: <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> nudge 1 px (hold <kbd>Shift</kbd> for 10), <kbd>+</kbd>/<kbd>−</kbd> scale, <kbd>[</kbd>/<kbd>]</kbd> rotate, <kbd>F</kbd> flip, <kbd>0</kbd> reset this entry.</p>
      <label>Result: the <code>shapes</code> and <code>parts</code> sections of src/fit-data.js <textarea id="out" readonly spellcheck="false"></textarea></label>
      <div class="actions-row"><button type="button" id="copy" class="btn btn-small">Copy result</button><button type="button" id="reset" class="btn btn-small">Discard all edits</button></div>
    </section>
  </main>
  <script type="module" src="src/fit.js"></script>
</body>
</html>
